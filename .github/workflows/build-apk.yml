name: Build Shahid Desktop Browser APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 17 for Android SDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-28" "build-tools;28.0.3"
      - name: Setup JDK 8 for Gradle
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'
      - name: Install Gradle 5.4.1
        run: |
          curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-5.4.1-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-5.4.1/bin" >> "$GITHUB_PATH"
      - name: Build APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShahidDesktopBrowser-serious-v2
          path: app/build/outputs/apk/debug/app-debug.apk
