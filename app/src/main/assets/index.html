<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Shahid Desktop Browser</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:Arial,sans-serif}
#toolbar{height:56px;background:#202124;display:flex;align-items:center;gap:7px;padding:8px}
.tool{width:38px;height:38px;border:1px solid #555;background:#303134;color:#fff;border-radius:6px;font-size:21px;cursor:pointer}
.tool:hover,.tool:focus{outline:2px solid #8ab4f8;background:#3c4043}
#address{height:38px;flex:1;border:1px solid #555;border-radius:19px;background:#fff;color:#222;padding:0 16px;font-size:15px;direction:ltr;outline:none}
#address:focus{border-color:#8ab4f8}
#status{position:absolute;left:10px;bottom:8px;background:rgba(0,0,0,.75);padding:7px 11px;border-radius:5px;font-size:12px;display:none;z-index:20}
#browser{position:absolute;top:56px;left:0;right:0;bottom:0;background:#fff}
#home{position:absolute;inset:0;background:linear-gradient(135deg,#111,#242424);display:flex;align-items:center;justify-content:center;z-index:5}
.homebox{text-align:center;max-width:700px;width:90%}.homebox h1{font-size:42px;margin:0 0 12px}.homebox p{color:#bbb;font-size:18px}
.quick{display:inline-block;margin:7px;padding:12px 18px;border:1px solid #555;border-radius:8px;background:#303134;color:#fff;cursor:pointer}
#frame{position:absolute;width:100%;height:100%;border:0;background:#fff;display:none}
#videoOverlay{display:none;position:absolute;inset:0;background:#000;z-index:30}
#video{width:100%;height:100%;background:#000;object-fit:contain}
#videoControls{position:absolute;left:0;right:0;bottom:0;padding:12px 14px;background:linear-gradient(transparent,rgba(0,0,0,.9));display:flex;align-items:center;gap:8px}
#seek{flex:1}#videoTitle{position:absolute;top:14px;left:18px;right:18px;font-size:17px;text-align:left;text-shadow:0 1px 3px #000}
#note{position:absolute;bottom:56px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,.9);padding:9px 14px;border-radius:5px;font-size:12px;display:none}
</style>
</head>
<body>
<div id="toolbar">
<button class="tool" tabindex="0" onclick="goBack()" title="Back">‹</button>
<button class="tool" tabindex="0" onclick="goForward()" title="Forward">›</button>
<button class="tool" tabindex="0" onclick="reloadPage()" title="Reload">↻</button>
<button class="tool" tabindex="0" onclick="goHome()" title="Home">⌂</button>
<input id="address" value="https://shahid.mbc.net/" aria-label="Address">
<button class="tool" tabindex="0" onclick="navigate()" title="Go">➜</button>
</div>

<div id="browser">
<div id="home">
<div class="homebox">
<h1>Shahid Desktop Browser</h1>
<p>متصفح مخصص للتلفزيون بواجهة Desktop.</p>
<button class="quick" onclick="openSite('https://shahid.mbc.net/')">فتح Shahid</button>
<button class="quick" onclick="openSite('https://www.google.com/')">Google</button>
</div>
</div>
<iframe id="frame"
src=""
allow="autoplay; fullscreen; encrypted-media; picture-in-picture"
allowfullscreen
referrerpolicy="strict-origin-when-cross-origin"></iframe>

<div id="videoOverlay">
<div id="videoTitle">Video</div>
<video id="video" controls playsinline></video>
<div id="note"></div>
<div id="videoControls">
<button class="tool" onclick="togglePlay()">▶</button>
<input id="seek" type="range" min="0" max="1000" value="0">
<button class="tool" onclick="toggleFullscreen()">⛶</button>
<button class="tool" onclick="closePlayer()">✕</button>
</div>
</div>
</div>
<div id="status"></div>

<script>
/* Desktop-compatible browser identity for ordinary page scripts.
   This does not bypass DRM or content protection. */
(function(){
  try{
    Object.defineProperty(Navigator.prototype,'platform',{get:function(){return 'Win32';}});
    Object.defineProperty(Navigator.prototype,'vendor',{get:function(){return 'Google Inc.';}});
    Object.defineProperty(Navigator.prototype,'maxTouchPoints',{get:function(){return 0;}});
  }catch(e){}
})();

const frame=document.getElementById('frame');
const home=document.getElementById('home');
const address=document.getElementById('address');
const statusBox=document.getElementById('status');
const video=document.getElementById('video');
const overlay=document.getElementById('videoOverlay');
const seek=document.getElementById('seek');

function normalize(u){
  u=u.trim();
  if(!u) return 'https://shahid.mbc.net/';
  if(!/^https?:\/\//i.test(u)) u='https://'+u;
  return u;
}
function navigate(){openSite(normalize(address.value));}
function openSite(u){
  u=normalize(u); address.value=u;
  home.style.display='none'; frame.style.display='block'; frame.src=u;
  showStatus('جاري فتح الموقع…');
}
function goHome(){frame.style.display='none';home.style.display='flex';address.value='https://shahid.mbc.net/';}
function reloadPage(){if(frame.style.display!=='none') frame.src=frame.src;}
function goBack(){try{frame.contentWindow.history.back()}catch(e){}}
function goForward(){try{frame.contentWindow.history.forward()}catch(e){}}
function showStatus(t){statusBox.textContent=t;statusBox.style.display='block';setTimeout(()=>statusBox.style.display='none',1800)}
frame.addEventListener('load',()=>{showStatus('تم تحميل الصفحة');try{address.value=frame.contentWindow.location.href}catch(e){}});

address.addEventListener('keydown',e=>{if(e.key==='Enter')navigate();});

video.addEventListener('timeupdate',()=>{
  if(video.duration) seek.value=Math.round((video.currentTime/video.duration)*1000);
});
seek.addEventListener('input',()=>{if(video.duration)video.currentTime=(seek.value/1000)*video.duration});
function togglePlay(){if(video.paused)video.play();else video.pause();}
function toggleFullscreen(){
  if(video.requestFullscreen) video.requestFullscreen();
  else if(overlay.requestFullscreen) overlay.requestFullscreen();
}
function closePlayer(){video.pause();video.removeAttribute('src');video.load();overlay.style.display='none';}
video.addEventListener('error',()=>showStatus('المشغل لم يستطع تشغيل مصدر الفيديو'));
</script>
</body>
</html>
